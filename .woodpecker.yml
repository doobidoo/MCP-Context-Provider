when:
  event: [push, pull_request, tag, manual]

steps:
  install:
    image: node:20
    commands:
      - npm ci

  lint:
    image: node:20
    commands:
      - npm run lint

  build:
    image: node:20
    commands:
      - npm run build

  test:
    image: node:20
    commands:
      - npm test

  validate-json:
    image: node:20
    commands:
      # Block scalar, not a one-liner: the inline form contained `Checking: `,
      # and YAML read the `: ` as a mapping separator, so the whole pipeline
      # failed to compile.
      - |
        for f in contexts/*.json; do
          [ -f "$f" ] || continue
          echo "Checking $(basename "$f")"
          node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"
        done
        echo "All JSON files valid"
